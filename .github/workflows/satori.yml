name: Satori

on:
  push:
    branches: [ "*" ]

jobs:

  build_linux_musl_x64:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-amd64-musl
      env:
        ROOTFS_DIR: /crossrootfs/x64/
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh -c Release -arch x64 /p:DotNetBuildAllRuntimePacks=true /p:DotNetFinalVersionKind=release

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: linux_musl_x64
          path: artifacts/packages/Release/Shipping


  build_linux_musl_arm64:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-arm64-musl
      env:
        ROOTFS_DIR: /crossrootfs/arm64/
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh -c Release -arch arm64 /p:DotNetBuildAllRuntimePacks=true /p:DotNetFinalVersionKind=release

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: linux_musl_arm64
          path: artifacts/packages/Release/Shipping


  build_linux_x64:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-amd64
      env:
        ROOTFS_DIR: /crossrootfs/x64/
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh -c Release -arch x64 /p:DotNetBuildAllRuntimePacks=true /p:DotNetFinalVersionKind=release

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: linux_x64
          path: artifacts/packages/Release/Shipping


  build_linux_arm64:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-arm64
      env:
        ROOTFS_DIR: /crossrootfs/arm64/
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh -c Release -arch arm64 /p:DotNetBuildAllRuntimePacks=true /p:DotNetFinalVersionKind=release

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: linux_arm64
          path: artifacts/packages/Release/Shipping


  build_windows_x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.cmd -c Release -arch x64 /p:DotNetBuildAllRuntimePacks=true /p:DotNetFinalVersionKind=release

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: windows_x64
          path: artifacts/packages/Release/Shipping


  build_windows_arm64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.cmd -c Release -arch arm64 /p:DotNetBuildAllRuntimePacks=true /p:DotNetFinalVersionKind=release

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: windows_arm64
          path: artifacts/packages/Release/Shipping
