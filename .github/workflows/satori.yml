name: Satori

on:
  push:
    branches: [ "*" ]
    tags:
      - "v*"

jobs:

  build_linux_musl_x64:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-amd64-musl
      env:
        ROOTFS_DIR: /crossrootfs/x64/
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          tdnf install -y \
            openssl-devel \
            libicu-devel \
            zlib-devel \
            krb5-devel

      - name: Build
        run: ./build.sh -c Release -arch x64 /p:DotNetBuildAllRuntimePacks=true /p:DotNetFinalVersionKind=release

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: linux_musl_x64
          path: |
            artifacts/packages/Release/Shipping/**/*.nupkg
            !artifacts/packages/Release/Shipping/**/*.symbols.nupkg
            
  build_linux_x64:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-amd64
      env:
        ROOTFS_DIR: /crossrootfs/x64/
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          tdnf install -y \
            openssl-devel \
            libicu-devel \
            krb5-devel
      - name: Build
        run: ./build.sh -c Release -arch x64 /p:DotNetBuildAllRuntimePacks=true /p:DotNetFinalVersionKind=release
      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: linux_x64
          path: |
            artifacts/packages/Release/Shipping/**/*.nupkg
            !artifacts/packages/Release/Shipping/**/*.symbols.nupkg

  build_windows_x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.cmd -c Release -arch x64 /p:DotNetBuildAllRuntimePacks=true /p:DotNetFinalVersionKind=release
      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: windows_x64
          path: |
            artifacts/packages/Release/Shipping/**/*.nupkg
            !artifacts/packages/Release/Shipping/**/*.symbols.nupkg

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build_linux_musl_x64
      - build_linux_x64
      - build_windows_x64
      - build_windows_arm64
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/**/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}